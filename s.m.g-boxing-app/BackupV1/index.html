<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="app-version" content="1.2.0" />
    
    <!-- PWA Settings : SMG Boxing Club -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="S.M.G Boxing" />

    <title>S.M.G Boxing Club 01</title>

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#020617',
                primary: '#0ea5e9', // Cyan Shogun
                secondary: '#e11d48', // Rose Combat
                accent: '#f8fafc',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }

      body {
        background-color: #020617;
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        /* Empêche le rebond élastique sur iOS pour l'effet WebApp */
        overscroll-behavior-y: none; 
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Scrollbar Cyberpunk */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #020617;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0ea5e9;
      }

      /* Correction pour encoches iPhone (Safe Areas) */
      .pb-safe {
        padding-bottom: var(--sab);
      }
      .pt-safe {
        padding-top: var(--sat);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Script principal : On pointe directement sur index.tsx à la racine -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
